<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070a12" />
<title>Offline — GameForge Portal</title>
<link rel="stylesheet" href="./styles.css" />
<style>
  .offline-wrap {
    min-height: 100dvh; display: grid; place-items: center; text-align: center;
    padding: 28px 22px calc(28px + env(safe-area-inset-bottom));
  }
  .offline-wrap .mark { width: 74px; height: 74px; margin: 0 auto 18px; color: var(--accent); }
  .offline-wrap h1 { font-size: 25px; margin-bottom: 10px; }
  .offline-wrap p { color: var(--muted); max-width: 44ch; margin: 0 auto 20px; font-size: 14.5px; }
</style>
</head>
<body>
  <main class="offline-wrap">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="74" height="74">
        <path d="M16 2.6 27.8 9.3v13.4L16 29.4 4.2 22.7V9.3z" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".5"/>
        <path d="M16 8.4 22.6 12v7.2L16 22.8 9.4 19.2V12z" fill="currentColor"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>This page isn't in the cached copy of the portal. Reconnect and reload — the build index and project documentation stay available offline once loaded.</p>
    <button class="btn btn-primary" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
