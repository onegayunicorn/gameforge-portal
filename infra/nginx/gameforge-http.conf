# Bootstrap vhost: port 80 only, no TLS.
#
# This file exists so that nginx can start and answer the Let's Encrypt HTTP-01
# challenge *before* any certificate exists. Installing a vhost that points at
# /etc/letsencrypt/live/... before certbot has issued the certificate makes
# `nginx -t` fail, which in turn makes `certbot --nginx` fail — a deadlock.
#
# infra/enable-tls.sh replaces this vhost with gameforge-tls.conf once the
# certificate is on disk.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    access_log /var/log/nginx/gameforge-access.log;
    error_log  /var/log/nginx/gameforge-error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    include /etc/nginx/snippets/gameforge-headers.conf;
    include /etc/nginx/snippets/gameforge-locations.conf;
}
