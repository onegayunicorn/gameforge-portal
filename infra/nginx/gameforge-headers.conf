# Security headers, included at server level and inside every location that sets an
# add_header of its own. nginx does not merge add_header directives: a location that
# declares one discards everything inherited from the server block, so the include has
# to be repeated rather than relied upon.
#
# No Content-Security-Policy here on purpose: the pages ship their own CSP in a <meta>
# tag, and a second policy would be enforced in addition to it, not instead of it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
