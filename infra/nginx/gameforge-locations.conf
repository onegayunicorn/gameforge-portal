# Shared locations, included by both the bootstrap (port 80) and the TLS (port 443)
# server blocks. nginx serves the generated installable site as static files and only
# forwards /api/ to the Node process.
#
# Why not proxy everything to Node: scripts/serve.js serves portal/ only. The manifest,
# the service worker and offline.html live in the generated pwa/ tree, so proxying the
# whole site to Node would produce a page that cannot be installed.

root __APP_DIR__/pwa;
index index.html;
charset utf-8;

# Assets are content-hashed by the build; documents and the worker are not, and the
# worker must be revalidated on every load or a deploy is never picked up.
location = /sw.js {
    include /etc/nginx/snippets/gameforge-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

location = /manifest.webmanifest {
    include /etc/nginx/snippets/gameforge-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location = /index.html {
    include /etc/nginx/snippets/gameforge-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Runtime endpoint. Deliberately never cached; the service worker skips it too.
location /api/ {
    include /etc/nginx/snippets/gameforge-headers.conf;
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}

location / {
    include /etc/nginx/snippets/gameforge-headers.conf;
    try_files $uri $uri/ =404;
}
