# Production vhost: HTTP redirects to HTTPS, HTTPS serves the installable site.
#
# Installed by infra/enable-tls.sh after `certbot certonly` has written a real
# certificate for __DOMAIN__ to /etc/letsencrypt/live/__DOMAIN__/.

# Only upgrade the connection when the client actually asked for an upgrade.
# Sending `Connection: upgrade` on every request breaks keep-alive to the API.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` as a listen parameter: nginx 1.24 (Ubuntu 24.04) does not accept the
    # standalone `http2 on;` directive, and 1.25+ still accepts this form.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    access_log /var/log/nginx/gameforge-access.log;
    error_log  /var/log/nginx/gameforge-error.log warn;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN__/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:GameForgeTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.53 valid=300s;
    resolver_timeout 5s;

    include /etc/nginx/snippets/gameforge-headers.conf;
    include /etc/nginx/snippets/gameforge-locations.conf;
}
