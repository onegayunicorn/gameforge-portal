<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="{{CLEAR_COLOR}}" />
<!-- Builds are self-contained by design: nothing may be fetched from another origin at runtime. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'" />
<title>{{GAME_NAME}}</title>
<!--
  Runtime shell generated by the build pipeline (pipeline/manifest-generator.ts).
  Placeholders replaced per game: {{GAME_NAME}} {{GAME_ID}} {{WIDTH}} {{HEIGHT}} {{CLEAR_COLOR}}.
  The built bundle is engine.js (runtime + engine + shared chunks); the game module is loaded
  dynamically from game.js by runtime/bootstrap.ts.
-->
<link rel="stylesheet" href="./runtime.css" />
</head>
<body style="--game-width: {{WIDTH}}px; --game-height: {{HEIGHT}}px; background: {{CLEAR_COLOR}};">
  <div id="gameforge-root" data-game-id="{{GAME_ID}}">
    <div id="gameforge-stage">
      <canvas id="gameforge-canvas" width="{{WIDTH}}" height="{{HEIGHT}}" tabindex="0"></canvas>
      <div id="gameforge-overlay" aria-live="polite"></div>
    </div>
    <footer id="gameforge-footer">
      <span id="gameforge-title">{{GAME_NAME}}</span>
      <span id="gameforge-status" data-state="booting">booting</span>
      <span id="gameforge-controls">
        <button type="button" id="gameforge-restart" title="Restart the game">Restart</button>
        <button type="button" id="gameforge-fullscreen" title="Toggle fullscreen">Fullscreen</button>
      </span>
    </footer>
  </div>
  <script type="module" src="./engine.js"></script>
</body>
</html>
