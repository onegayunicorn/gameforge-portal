apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith-bay-web
spec:
  replicas: 2
  selector: { matchLabels: { app: monolith-bay-web } }
  template:
    metadata: { labels: { app: monolith-bay-web } }
    spec:
      containers:
        - name: web
          image: monolith-bay-web:latest
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
