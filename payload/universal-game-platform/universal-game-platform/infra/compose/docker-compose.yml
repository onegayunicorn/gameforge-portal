version: "3.9"
services:
  game-web:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.web }
    ports: ["8080:80"]
  object-storage:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
