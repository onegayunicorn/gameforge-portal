server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|svg|wasm|ogg|ktx2)$ { expires 31536000; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /release-manifest.json { add_header Cache-Control "no-store"; }
    location = /build-info.json { add_header Cache-Control "no-store"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
}
