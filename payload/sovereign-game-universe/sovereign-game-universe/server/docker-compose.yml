version: "3.9"
services:
  media: { image: jellyfin/jellyfin, ports: ["8096:8096"], volumes: ["./data/media:/media"] }
  files: { image: filebrowser/filebrowser, ports: ["8080:80"], volumes: ["./data/files:/srv"] }
  backup: { image: restic/restic, volumes: ["./data:/data", "./backups:/backup"] }
  monitoring: { image: prom/prometheus, ports: ["9090:9090"] }
  proxy: { image: nginx:alpine, ports: ["80:80", "443:443"], volumes: ["./nginx.conf:/etc/nginx/nginx.conf"] }
