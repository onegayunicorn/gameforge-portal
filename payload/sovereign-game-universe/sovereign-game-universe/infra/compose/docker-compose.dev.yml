version: "3.9"
services:
  postgres: { image: "postgres:16-alpine", environment: { POSTGRES_PASSWORD: postgres }, ports: ["5432:5432"] }
  redis: { image: "redis:7-alpine", ports: ["6379:6379"] }
  minio: { image: "minio/minio", command: "server /data --console-address :9001", ports: ["9000:9000", "9001:9001"], environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin } }
  opensearch: { image: "opensearchproject/opensearch:2", ports: ["9200:9200"], environment: { "discovery.type": "single-node", "DISABLE_SECURITY_PLUGIN": "true" } }
